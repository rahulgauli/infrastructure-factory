name: Terraform Rego Policy Validation

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "terraform/**"
      - "policies/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-policy:
    name: Terraform – Rego Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install conftest
        run: |
          VERSION="0.56.0"
          curl -sSLo /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/conftest.tar.gz -C /usr/local/bin conftest
          conftest --version

      - name: Run Rego policies against Terraform files
        id: conftest
        run: |
          TF_FILES=$(find terraform/ -name "*.tf" | sort | tr '\n' ' ')
          if [ -z "$TF_FILES" ]; then
            echo "No Terraform files found."
            echo "[]" > /tmp/conftest-results.json
            echo "conftest_exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086
          # First pass: write JSON for the parse step (|| true so this step continues)
          conftest test $TF_FILES \
            --parser hcl2 \
            --all-namespaces \
            --policy policies/terraform/ \
            --output json 2>&1 | tee /tmp/conftest-results.json || true
          # Second pass: capture real exit code (non-zero = deny failures)
          set +e
          conftest test $TF_FILES \
            --parser hcl2 \
            --all-namespaces \
            --policy policies/terraform/ \
            --output stdout 2>&1
          echo "conftest_exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Parse policy results and post PR comment
        id: summary
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // ── 1. Parse conftest JSON output ───────────────────────────────
            let data = [];
            try {
              const raw = fs.readFileSync('/tmp/conftest-results.json', 'utf8').trim();
              data = raw ? JSON.parse(raw) : [];
            } catch (e) {
              core.warning(`Could not parse conftest results: ${e.message}`);
            }

            const findings = [];
            for (const result of data) {
              const shortFile = (result.filename || '').replace('terraform/modules/', '');
              for (const f of result.failures || []) {
                const msg = (f.msg || '').slice(0, 250);
                if (msg) findings.push({ severity: '❌ FAIL', file: shortFile, msg });
              }
              for (const w of result.warnings || []) {
                const msg = (w.msg || '').slice(0, 250);
                if (msg) findings.push({ severity: '⚠️ WARN', file: shortFile, msg });
              }
            }

            const failCount  = findings.filter(f => f.severity.includes('FAIL')).length;
            const warnCount  = findings.filter(f => f.severity.includes('WARN')).length;
            const totalCount = findings.length;

            let detailsTable = '_No Rego policy violations found. ✅_';
            if (findings.length) {
              const rows = findings.map((f, i) => {
                const msg = f.msg.replace(/\|/g, '\\|').replace(/\n/g, ' ');
                return `| ${i + 1} | ${f.severity} | \`${f.file}\` | ${msg} |`;
              });
              detailsTable = [
                '| # | Severity | File | Policy Violation |',
                '|---|----------|------|-----------------|',
                ...rows,
              ].join('\n');
            }

            // ── 2. Write job summary (visible in Actions UI even on failure) ─
            const statusIcon = failCount > 0 ? '🔴' : warnCount > 0 ? '🟡' : '✅';
            const now = new Date().toUTCString();

            const summaryBody = [
              `## 📋 Terraform Rego Policy Validation`,
              ``,
              `> 🕐 **Last updated:** ${now}`,
              `> Triggered by commit \`${context.sha.slice(0, 7)}\` on PR #${context.issue.number}`,
              ``,
              `### 📊 Summary`,
              ``,
              `| Status | Failures | Warnings | Total |`,
              `|--------|----------|----------|-------|`,
              `| ${statusIcon} | ❌ ${failCount} | ⚠️ ${warnCount} | ${totalCount} |`,
              ``,
              `> **Policy files:** \`policies/terraform/aws.rego\`, \`policies/terraform/gcp.rego\`, \`policies/terraform/azure.rego\``,
              ``,
              `---`,
              ``,
              `### 🔍 Detailed Findings`,
              ``,
              detailsTable,
            ].join('\n');

            await core.summary.addRaw(summaryBody).write();

            // ── 3. Upsert PR comment ─────────────────────────────────────────
            const fullBody = summaryBody + [
              ``,
              `---`,
              ``,
              `<sub>Full JSON output is available in the [workflow run artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).</sub>`,
            ].join('\n');

            const marker = '<!-- terraform-rego-policy -->';
            const markedBody = marker + '\n' + fullBody;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body: markedBody,
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body: markedBody,
              });
              core.info('Created new policy scan comment');
            }

            // ── 4. Fail the job if deny violations were found ────────────────
            if (failCount > 0) {
              core.setFailed(`❌ ${failCount} Rego policy deny violation(s) detected. See the PR comment for details.`);
            }

      - name: Upload conftest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conftest-results
          path: /tmp/conftest-results.json
