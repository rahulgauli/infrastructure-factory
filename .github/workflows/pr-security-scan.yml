name: PR Security Scan

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  sca-scan:
    name: SCA – Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.summary.outputs.result }}
      finding_count: ${{ steps.summary.outputs.finding_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy (SCA – filesystem)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: ${{ runner.temp }}/sca-results.json
          scanners: vuln
          exit-code: "0"

      - name: Parse SCA results
        id: summary
        run: |
          python3 - <<'EOF'
          import json, os

          results_path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "sca-results.json")
          try:
              with open(results_path) as f:
                  data = json.load(f)
          except Exception:
              data = {}

          vulns = []
          for result in data.get("Results", []):
              target = result.get("Target", "")
              for v in result.get("Vulnerabilities") or []:
                  vulns.append({
                      "package": v.get("PkgName", "unknown"),
                      "version": v.get("InstalledVersion", "unknown"),
                      "id": v.get("VulnerabilityID", ""),
                      "severity": v.get("Severity", "UNKNOWN"),
                      "description": (v.get("Description") or "")[:200],
                      "fix_version": v.get("FixedVersion") or "N/A",
                      "target": target,
                  })

          lines = []
          if vulns:
              lines.append("| # | Package | Version | Severity | Vuln ID | Fix Version | Target |")
              lines.append("|---|---------|---------|----------|---------|-------------|--------|")
              for i, v in enumerate(vulns, 1):
                  desc_col = v["description"].replace("|", "\\|").replace("\n", " ")
                  lines.append(
                      f"| {i} | `{v['package']}` | {v['version']} | {v['severity']} | {v['id']} | {v['fix_version']} | `{v['target']}` |"
                  )
              result = "\n".join(lines)
          else:
              result = "_No vulnerable dependencies found._"

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              # Use multiline delimiter for the table
              delimiter = "EOF_SCA"
              gh_out.write(f"result<<{delimiter}\n{result}\n{delimiter}\n")
              gh_out.write(f"finding_count={len(vulns)}\n")
          EOF

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-results
          path: ${{ runner.temp }}/sca-results.json

  sast-scan:
    name: SAST – Static Code Analysis
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.summary.outputs.result }}
      finding_count: ${{ steps.summary.outputs.finding_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (SAST – Python)
        id: bandit
        run: |
          bandit -r app/ -f json -o /tmp/sast-bandit.json \
            --severity-level medium --confidence-level medium || true

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SAST – general)
        id: semgrep
        run: |
          semgrep scan --config=auto --json --output /tmp/sast-semgrep.json \
            --severity ERROR --severity WARNING \
            app/ || true

      - name: Parse SAST results
        id: summary
        run: |
          python3 - <<'EOF'
          import json, os

          findings = []

          # Bandit results
          try:
              with open("/tmp/sast-bandit.json") as f:
                  bandit_data = json.load(f)
              for issue in bandit_data.get("results", []):
                  findings.append({
                      "tool": "Bandit",
                      "severity": issue.get("issue_severity", ""),
                      "rule": issue.get("test_id", ""),
                      "message": issue.get("issue_text", "")[:150],
                      "location": f"{issue.get('filename','')}:{issue.get('line_number','')}",
                  })
          except Exception:
              pass

          # Semgrep results
          try:
              with open("/tmp/sast-semgrep.json") as f:
                  semgrep_data = json.load(f)
              for r in semgrep_data.get("results", []):
                  findings.append({
                      "tool": "Semgrep",
                      "severity": r.get("extra", {}).get("severity", ""),
                      "rule": r.get("check_id", "").split(".")[-1],
                      "message": r.get("extra", {}).get("message", "")[:150],
                      "location": f"{r.get('path','')}:{r.get('start',{}).get('line','')}",
                  })
          except Exception:
              pass

          lines = []
          if findings:
              lines.append("| # | Tool | Severity | Rule | Location | Message |")
              lines.append("|---|------|----------|------|----------|---------|")
              for i, f in enumerate(findings, 1):
                  msg = f["message"].replace("|", "\\|").replace("\n", " ")
                  lines.append(
                      f"| {i} | {f['tool']} | {f['severity']} | `{f['rule']}` | `{f['location']}` | {msg} |"
                  )
              result = "\n".join(lines)
          else:
              result = "_No SAST findings at the configured severity thresholds._"

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              delimiter = "EOF_SAST"
              gh_out.write(f"result<<{delimiter}\n{result}\n{delimiter}\n")
              gh_out.write(f"finding_count={len(findings)}\n")
          EOF

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: |
            /tmp/sast-bandit.json
            /tmp/sast-semgrep.json

  iac-scan:
    name: IaC – Infrastructure as Code Scan
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.summary.outputs.result }}
      finding_count: ${{ steps.summary.outputs.finding_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov (IaC – Terraform + Docker)
        id: checkov
        run: |
          checkov -d . \
            --framework terraform dockerfile \
            --output json \
            --output-file /tmp/iac-results.json \
            --compact \
            --quiet || true

      - name: Parse IaC results
        id: summary
        run: |
          python3 - <<'EOF'
          import json, os

          findings = []

          try:
              with open("/tmp/iac-results.json") as f:
                  raw = f.read().strip()
              # Checkov may emit one JSON object per framework; handle both list and dict
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  # Multiple JSON objects concatenated – split on top-level boundaries
                  import re
                  sections = [m for m in re.split(r'\n(?=\{)', raw) if m.strip()]
                  data = []
                  for s in sections:
                      try:
                          data.append(json.loads(s))
                      except json.JSONDecodeError:
                          pass

              if isinstance(data, dict):
                  data = [data]

              for section in data:
                  for check in section.get("results", {}).get("failed_checks", []):
                      findings.append({
                          "framework": section.get("check_type", "terraform"),
                          "severity": check.get("severity") or "MEDIUM",
                          "check_id": check.get("check_id", ""),
                          "resource": check.get("resource", ""),
                          "location": f"{check.get('repo_file_path','')}: lines {check.get('file_line_range',['?','?'])[0]}–{check.get('file_line_range',['?','?'])[-1]}",
                          "guideline": (check.get("guideline") or "")[:120],
                      })
          except Exception as e:
              pass

          lines = []
          if findings:
              lines.append("| # | Framework | Severity | Check ID | Resource | Location | Guideline |")
              lines.append("|---|-----------|----------|----------|----------|----------|-----------|")
              for i, f in enumerate(findings, 1):
                  guide = f["guideline"].replace("|", "\\|").replace("\n", " ")
                  lines.append(
                      f"| {i} | {f['framework']} | {f['severity']} | `{f['check_id']}` | `{f['resource']}` | `{f['location']}` | {guide} |"
                  )
              result = "\n".join(lines)
          else:
              result = "_No IaC policy violations found._"

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              delimiter = "EOF_IAC"
              gh_out.write(f"result<<{delimiter}\n{result}\n{delimiter}\n")
              gh_out.write(f"finding_count={len(findings)}\n")
          EOF

      - name: Upload IaC results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-results
          path: /tmp/iac-results.json

  post-pr-comment:
    name: Post Scan Summary to PR
    runs-on: ubuntu-latest
    needs: [sca-scan, sast-scan, iac-scan]
    if: always()
    steps:
      - name: Build and post summary comment
        uses: actions/github-script@v7
        env:
          SCA_RESULT: ${{ needs.sca-scan.outputs.result }}
          SCA_COUNT: ${{ needs.sca-scan.outputs.finding_count }}
          SAST_RESULT: ${{ needs.sast-scan.outputs.result }}
          SAST_COUNT: ${{ needs.sast-scan.outputs.finding_count }}
          IAC_RESULT: ${{ needs.iac-scan.outputs.result }}
          IAC_COUNT: ${{ needs.iac-scan.outputs.finding_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const scaCount  = parseInt(process.env.SCA_COUNT  || "0");
            const sastCount = parseInt(process.env.SAST_COUNT || "0");
            const iacCount  = parseInt(process.env.IAC_COUNT  || "0");
            const total     = scaCount + sastCount + iacCount;

            const statusIcon = (count) => count > 0 ? "🔴" : "✅";

            const now = new Date().toUTCString();
            const body = [
              `## 🔍 Security Scan Results`,
              ``,
              `> 🕐 **Last updated:** ${now}`,
              `> Triggered by commit \`${context.sha.slice(0,7)}\` on PR #${context.issue.number}`,
              ``,
              `### 📊 Summary`,
              ``,
              `| # | Scan Type | Tool(s) | Findings |`,
              `|---|-----------|---------|----------|`,
              `| 1 | SCA – Dependency Vulnerabilities | Trivy | ${statusIcon(scaCount)} ${scaCount} |`,
              `| 2 | SAST – Static Code Analysis | Bandit, Semgrep | ${statusIcon(sastCount)} ${sastCount} |`,
              `| 3 | IaC – Infrastructure as Code | Checkov | ${statusIcon(iacCount)} ${iacCount} |`,
              `| | **Total** | | **${total}** |`,
              ``,
              `---`,
              ``,
              `### 1️⃣ SCA – Dependency Vulnerability Scan (Trivy)`,
              ``,
              process.env.SCA_RESULT,
              ``,
              `---`,
              ``,
              `### 2️⃣ SAST – Static Code Analysis (Bandit + Semgrep)`,
              ``,
              process.env.SAST_RESULT,
              ``,
              `---`,
              ``,
              `### 3️⃣ IaC – Infrastructure as Code Scan (Checkov)`,
              ``,
              process.env.IAC_RESULT,
              ``,
              `---`,
              ``,
              `<sub>Full JSON artifacts are available in the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).</sub>`,
            ].join("\n");

            // Find existing bot comment for this PR and update it, or create a new one
            const marker = "<!-- pr-security-scan -->";
            const markedBody = marker + "\n" + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === "Bot" && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: markedBody,
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: markedBody,
              });
              core.info("Created new scan summary comment");
            }
