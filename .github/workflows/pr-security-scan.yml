name: PR Security Scan

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: write

jobs:
  sca-scan:
    name: SCA – Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    outputs:
      finding_count: ${{ steps.summary.outputs.finding_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and generate pinned requirements
        run: |
          pip install -r requirements.txt -q
          # Trivy matches on filename "requirements.txt" and needs == pinned versions.
          # Generate a pinned snapshot from the resolved environment for accurate SCA.
          pip freeze > ${{ runner.temp }}/requirements.txt

      - name: Run Trivy (SCA – filesystem, JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/requirements.txt
          format: json
          output: ${{ runner.temp }}/sca-results.json
          scanners: vuln
          exit-code: "0"

      - name: Run Trivy (SCA – filesystem, SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/requirements.txt
          format: sarif
          output: ${{ runner.temp }}/sca-results.sarif
          scanners: vuln
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/sca-results.sarif
          category: sca-trivy

      - name: Parse SCA results
        id: summary
        run: |
          python3 - <<'EOF'
          import json, os

          results_path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "sca-results.json")
          try:
              with open(results_path) as f:
                  data = json.load(f)
          except Exception:
              data = {}

          vulns = []
          for result in data.get("Results", []):
              target = result.get("Target", "")
              for v in result.get("Vulnerabilities") or []:
                  vulns.append({
                      "package": v.get("PkgName", "unknown"),
                      "version": v.get("InstalledVersion", "unknown"),
                      "id": v.get("VulnerabilityID", ""),
                      "severity": v.get("Severity", "UNKNOWN"),
                      "description": (v.get("Description") or "")[:200],
                      "fix_version": v.get("FixedVersion") or "N/A",
                      "target": target,
                  })

          lines = []
          if vulns:
              lines.append("| # | Package | Version | Severity | Vuln ID | Fix Version | Target |")
              lines.append("|---|---------|---------|----------|---------|-------------|--------|")
              for i, v in enumerate(vulns, 1):
                  desc_col = v["description"].replace("|", "\\|").replace("\n", " ")
                  lines.append(
                      f"| {i} | `{v['package']}` | {v['version']} | {v['severity']} | {v['id']} | {v['fix_version']} | `{v['target']}` |"
                  )
              result = "\n".join(lines)
          else:
              result = "_No vulnerable dependencies found._"

          results_dir = os.environ.get("RUNNER_TEMP", "/tmp")
          with open(os.path.join(results_dir, "sca-comment.md"), "w") as f:
              f.write(result)

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"finding_count={len(vulns)}\n")
          EOF

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-results
          path: |
            ${{ runner.temp }}/sca-results.json
            ${{ runner.temp }}/sca-results.sarif
            ${{ runner.temp }}/sca-comment.md

  sast-scan:
    name: SAST – Static Code Analysis
    runs-on: ubuntu-latest
    outputs:
      finding_count: ${{ steps.summary.outputs.finding_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml] bandit-sarif-formatter

      - name: Run Bandit (SAST – Python, JSON)
        id: bandit
        run: |
          bandit -r app/ -f json -o ${{ runner.temp }}/sast-bandit.json \
            --severity-level medium --confidence-level medium || true

      - name: Run Bandit (SAST – Python, SARIF)
        run: |
          bandit -r app/ -f sarif -o ${{ runner.temp }}/sast-bandit.sarif \
            --severity-level medium --confidence-level medium || true

      - name: Upload Bandit SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/sast-bandit.sarif
          category: sast-bandit

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SAST – general, JSON)
        id: semgrep
        run: |
          semgrep scan --config=auto --json --output ${{ runner.temp }}/sast-semgrep.json \
            --severity ERROR --severity WARNING \
            app/ || true

      - name: Run Semgrep (SAST – general, SARIF)
        run: |
          semgrep scan --config=auto --sarif --output ${{ runner.temp }}/sast-semgrep.sarif \
            --severity ERROR --severity WARNING \
            app/ || true

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/sast-semgrep.sarif
          category: sast-semgrep

      - name: Parse SAST results
        id: summary
        run: |
          python3 - <<'EOF'
          import json, os

          findings = []

          runner_temp = os.environ.get("RUNNER_TEMP", "/tmp")

          # Bandit results
          try:
              with open(os.path.join(runner_temp, "sast-bandit.json")) as f:
                  bandit_data = json.load(f)
              for issue in bandit_data.get("results", []):
                  findings.append({
                      "tool": "Bandit",
                      "severity": issue.get("issue_severity", ""),
                      "rule": issue.get("test_id", ""),
                      "message": issue.get("issue_text", "")[:150],
                      "location": f"{issue.get('filename','')}:{issue.get('line_number','')}",
                  })
          except Exception:
              pass

          # Semgrep results
          try:
              with open(os.path.join(runner_temp, "sast-semgrep.json")) as f:
                  semgrep_data = json.load(f)
              for r in semgrep_data.get("results", []):
                  findings.append({
                      "tool": "Semgrep",
                      "severity": r.get("extra", {}).get("severity", ""),
                      "rule": r.get("check_id", "").split(".")[-1],
                      "message": r.get("extra", {}).get("message", "")[:150],
                      "location": f"{r.get('path','')}:{r.get('start',{}).get('line','')}",
                  })
          except Exception:
              pass

          lines = []
          if findings:
              lines.append("| # | Tool | Severity | Rule | Location | Message |")
              lines.append("|---|------|----------|------|----------|---------|")
              for i, f in enumerate(findings, 1):
                  msg = f["message"].replace("|", "\\|").replace("\n", " ")
                  lines.append(
                      f"| {i} | {f['tool']} | {f['severity']} | `{f['rule']}` | `{f['location']}` | {msg} |"
                  )
              result = "\n".join(lines)
          else:
              result = "_No SAST findings at the configured severity thresholds._"

          results_dir = os.environ.get("RUNNER_TEMP", "/tmp")
          with open(os.path.join(results_dir, "sast-comment.md"), "w") as f:
              f.write(result)

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"finding_count={len(findings)}\n")
          EOF

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: |
            ${{ runner.temp }}/sast-bandit.json
            ${{ runner.temp }}/sast-bandit.sarif
            ${{ runner.temp }}/sast-semgrep.json
            ${{ runner.temp }}/sast-semgrep.sarif
            ${{ runner.temp }}/sast-comment.md

  iac-scan:
    name: IaC – Infrastructure as Code Scan
    runs-on: ubuntu-latest
    outputs:
      finding_count: ${{ steps.summary.outputs.finding_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov (IaC – Terraform + Docker)
        id: checkov
        run: |
          checkov -d . \
            --framework terraform dockerfile \
            --output json \
            --compact \
            --quiet > ${{ runner.temp }}/iac-results.json || true

      - name: Parse IaC results
        id: summary
        run: |
          python3 - <<'EOF'
          import json, os

          findings = []
          results_path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "iac-results.json")

          try:
              with open(results_path) as f:
                  data = json.load(f)

              # Output is a list when multiple frameworks are scanned, dict for a single one
              if isinstance(data, dict):
                  data = [data]

              for section in data:
                  framework = section.get("check_type", "terraform")
                  for check in section.get("results", {}).get("failed_checks", []):
                      line_range = check.get("file_line_range") or ["?", "?"]
                      findings.append({
                          "framework": framework,
                          "check_id": check.get("check_id", ""),
                          "check_name": (check.get("check_name") or "")[:80],
                          "resource": check.get("resource", ""),
                          "location": f"{check.get('repo_file_path', '')}: L{line_range[0]}-{line_range[-1]}",
                          "guideline": (check.get("guideline") or "")[:100],
                      })
          except Exception as e:
              print(f"Warning: could not parse IaC results: {e}")

          lines = []
          if findings:
              lines.append("| # | Framework | Check ID | Check Name | Resource | Location |")
              lines.append("|---|-----------|----------|------------|----------|----------|")
              for i, f in enumerate(findings, 1):
                  name = f["check_name"].replace("|", "\\|").replace("\n", " ")
                  lines.append(
                      f"| {i} | {f['framework']} | `{f['check_id']}` | {name} | `{f['resource']}` | `{f['location']}` |"
                  )
              result = "\n".join(lines)
          else:
              result = "_No IaC policy violations found._"

          results_dir = os.environ.get("RUNNER_TEMP", "/tmp")
          with open(os.path.join(results_dir, "iac-comment.md"), "w") as f:
              f.write(result)

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"finding_count={len(findings)}\n")
          EOF

      - name: Upload IaC results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-results
          path: |
            ${{ runner.temp }}/iac-results.json
            ${{ runner.temp }}/iac-comment.md

  post-pr-comment:
    name: Post Scan Summary to PR
    runs-on: ubuntu-latest
    needs: [sca-scan, sast-scan, iac-scan]
    if: always()
    steps:
      - name: Download scan comment artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/scan-artifacts

      - name: Build and post summary comment
        uses: actions/github-script@v7
        env:
          SCA_COUNT: ${{ needs.sca-scan.outputs.finding_count }}
          SAST_COUNT: ${{ needs.sast-scan.outputs.finding_count }}
          IAC_COUNT: ${{ needs.iac-scan.outputs.finding_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const readArtifact = (path) => {
              try { return fs.readFileSync(path, 'utf8').trim(); }
              catch { return null; }
            };

            const scaCount  = parseInt(process.env.SCA_COUNT  || "0");
            const sastCount = parseInt(process.env.SAST_COUNT || "0");
            const iacCount  = parseInt(process.env.IAC_COUNT  || "0");
            const total     = scaCount + sastCount + iacCount;

            const scaResult  = readArtifact('/tmp/scan-artifacts/sca-results/sca-comment.md')
                            || '_No vulnerable dependencies found._';
            const sastResult = readArtifact('/tmp/scan-artifacts/sast-results/sast-comment.md')
                            || '_No SAST findings at the configured severity thresholds._';
            const iacResult  = readArtifact('/tmp/scan-artifacts/iac-results/iac-comment.md')
                            || '_No IaC policy violations found._';

            const statusIcon = (count) => count > 0 ? "🔴" : "✅";

            const now = new Date().toUTCString();

            const details = (icon, title, count, content) => [
              `<details${count > 0 ? " open" : ""}>`,
              `<summary>${icon} <strong>${title}</strong> — ${statusIcon(count)} ${count} finding${count !== 1 ? "s" : ""}</summary>`,
              ``,
              content,
              ``,
              `</details>`,
            ].join("\n");

            const body = [
              `## 🔍 Security Scan Results`,
              ``,
              `> 🕐 **Last updated:** ${now}`,
              `> Triggered by commit \`${context.sha.slice(0,7)}\` on PR #${context.issue.number}`,
              ``,
              `### 📊 Summary`,
              ``,
              `| # | Scan Type | Tool(s) | Findings |`,
              `|---|-----------|---------|----------|`,
              `| 1 | SCA – Dependency Vulnerabilities | Trivy | ${statusIcon(scaCount)} ${scaCount} |`,
              `| 2 | SAST – Static Code Analysis | Bandit, Semgrep | ${statusIcon(sastCount)} ${sastCount} |`,
              `| 3 | IaC – Infrastructure as Code | Checkov | ${statusIcon(iacCount)} ${iacCount} |`,
              `| | **Total** | | **${total}** |`,
              ``,
              `---`,
              ``,
              details("1️⃣", "SCA – Dependency Vulnerability Scan (Trivy)", scaCount, scaResult),
              ``,
              details("2️⃣", "SAST – Static Code Analysis (Bandit + Semgrep)", sastCount, sastResult),
              ``,
              details("3️⃣", "IaC – Infrastructure as Code Scan (Checkov)", iacCount, iacResult),
              ``,
              `---`,
              ``,
              `<sub>Full JSON artifacts are available in the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).</sub>`,
            ].join("\n");

            // Find existing bot comment for this PR and update it, or create a new one
            const marker = "<!-- pr-security-scan -->";
            const markedBody = marker + "\n" + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === "Bot" && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: markedBody,
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: markedBody,
              });
              core.info("Created new scan summary comment");
            }

  trigger-autofix:
    name: Trigger Copilot Auto-Fix Workflow
    runs-on: ubuntu-latest
    needs: [sca-scan, sast-scan, iac-scan, post-pr-comment]
    if: >-
      always() && (
        fromJSON(needs.sca-scan.outputs.finding_count  || '0') > 0 ||
        fromJSON(needs.sast-scan.outputs.finding_count || '0') > 0 ||
        fromJSON(needs.iac-scan.outputs.finding_count  || '0') > 0
      )
    steps:
      - name: Dispatch Copilot Security Auto-Fix
        uses: actions/github-script@v7
        env:
          SCA_COUNT: ${{ needs.sca-scan.outputs.finding_count }}
          SAST_COUNT: ${{ needs.sast-scan.outputs.finding_count }}
          IAC_COUNT: ${{ needs.iac-scan.outputs.finding_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = context.payload.repository.default_branch;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'copilot-security-autofix.yml',
              ref,
              inputs: {
                run_id: String(context.runId),
                head_branch: context.payload.pull_request?.head?.ref || '',
                head_sha: context.sha,
                sca_count: String(process.env.SCA_COUNT || '0'),
                sast_count: String(process.env.SAST_COUNT || '0'),
                iac_count: String(process.env.IAC_COUNT || '0'),
              }
            });
            core.info(`Dispatched copilot-security-autofix.yml on ${ref}`);
