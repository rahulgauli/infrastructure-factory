name: Copilot Security Auto-Fix

on:
  workflow_run:
    workflows: ["PR Security Scan"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

jobs:
  trigger-copilot-fix:
    name: Trigger Copilot Auto-Fix for Security Findings
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion != 'cancelled'
      && github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Resolve PR number and download scan artifacts
        id: context
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const path = require('path');
            const runId = context.payload.workflow_run.id;

            // --- 1. Resolve the pull request number ---------------------------------
            const headRepo = context.payload.workflow_run.head_repository;

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              head:  `${headRepo.owner.login}:${context.payload.workflow_run.head_branch}`,
            });

            if (!pulls.length) {
              core.setOutput('has_findings', 'false');
              core.info('No open PR found for this workflow run — skipping.');
              return;
            }
            const prNumber = pulls[0].number;
            core.setOutput('pr_number', String(prNumber));
            core.info(`Resolved PR #${prNumber}`);

            // --- 2. Download *-comment.md artifacts from the triggering run ---------
            // This is more reliable than parsing the PR comment body, which may not
            // yet be visible or may show "no findings" if the artifact download failed.
            const { data: artifactList } = await github.rest.actions.listWorkflowRunArtifacts({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              run_id: runId,
            });

            const noFindingsPatterns = [
              '_No vulnerable dependencies found._',
              '_No SAST findings at the configured severity thresholds._',
              '_No IaC policy violations found._',
            ];

            const wantedArtifacts = ['sca-results', 'sast-results', 'iac-results'];
            const commentFiles    = {
              'sca-results':  'sca-comment.md',
              'sast-results': 'sast-comment.md',
              'iac-results':  'iac-comment.md',
            };

            fs.mkdirSync('/tmp/scan-artifacts', { recursive: true });

            let totalFindings = 0;
            const sectionReports = {};

            for (const artifactName of wantedArtifacts) {
              const artifact = artifactList.artifacts.find(a => a.name === artifactName);
              if (!artifact) {
                core.warning(`Artifact '${artifactName}' not found in run ${runId}`);
                sectionReports[artifactName] = noFindingsPatterns[wantedArtifacts.indexOf(artifactName)];
                continue;
              }

              // Download the zip
              const { data: zipData } = await github.rest.actions.downloadArtifact({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });

              const zipPath = `/tmp/scan-artifacts/${artifactName}.zip`;
              fs.writeFileSync(zipPath, Buffer.from(zipData));

              // Unzip (use shell via exec)
              const { execSync } = require('child_process');
              const extractDir = `/tmp/scan-artifacts/${artifactName}`;
              fs.mkdirSync(extractDir, { recursive: true });
              execSync(`unzip -o ${zipPath} -d ${extractDir}`);

              // Read the comment markdown file
              const commentFile = path.join(extractDir, commentFiles[artifactName]);
              if (fs.existsSync(commentFile)) {
                const content = fs.readFileSync(commentFile, 'utf8').trim();
                sectionReports[artifactName] = content;
                // Any content that is NOT a "no findings" message means there are findings
                const isClean = noFindingsPatterns.some(p => content === p);
                if (!isClean) totalFindings++;
                core.info(`${artifactName}: ${isClean ? 'clean' : 'HAS FINDINGS'}`);
              } else {
                core.warning(`Comment file not found in artifact: ${commentFile}`);
                sectionReports[artifactName] = noFindingsPatterns[wantedArtifacts.indexOf(artifactName)];
              }
            }

            if (totalFindings === 0) {
              core.setOutput('has_findings', 'false');
              core.info('All scans are clean — no auto-fix needed.');
              return;
            }

            core.setOutput('has_findings', 'true');

            // --- 3. Build the scan report from artifact content ---------------------
            const report = [
              '### 1️⃣ SCA – Dependency Vulnerability Scan (Trivy)',
              '',
              sectionReports['sca-results'],
              '',
              '### 2️⃣ SAST – Static Code Analysis (Bandit + Semgrep)',
              '',
              sectionReports['sast-results'],
              '',
              '### 3️⃣ IaC – Infrastructure as Code Scan (Checkov)',
              '',
              sectionReports['iac-results'],
            ].join('\n');

            fs.writeFileSync('/tmp/scan-report.md', report);
            core.info(`Scan report saved (${report.length} chars).`);

      - name: Collect repository LLM context
        if: steps.context.outputs.has_findings == 'true'
        id: llm_context
        run: |
          CONTEXT_FILE="/tmp/repo-context.md"
          {
            echo "# Repository Context for Copilot Auto-Fix"
            echo ""

            # Copilot instructions
            if [ -f .github/copilot-instructions.md ]; then
              echo "## Copilot Instructions"
              echo ""
              cat .github/copilot-instructions.md
              echo ""
            fi

            echo "---"
            echo ""

            # Knowledge graph (summarised)
            if [ -f .github/knowledge-graph.json ]; then
              echo "## Knowledge Graph"
              echo ""
              echo '```json'
              cat .github/knowledge-graph.json
              echo '```'
              echo ""
            fi

            echo "---"
            echo ""

            # Copilot review policy
            if [ -f .github/policies/copilot-review-policy.yml ]; then
              echo "## Copilot Review Policy"
              echo ""
              echo '```yaml'
              cat .github/policies/copilot-review-policy.yml
              echo '```'
              echo ""
            fi

            echo "---"
            echo ""

            # Rego policies
            echo "## OPA Rego Policies"
            echo ""
            for f in policies/terraform/*.rego; do
              if [ -f "$f" ]; then
                echo "### $(basename "$f")"
                echo ""
                echo '```rego'
                cat "$f"
                echo '```'
                echo ""
              fi
            done

            echo "---"
            echo ""

            # Requirements
            if [ -f requirements.txt ]; then
              echo "## Python Dependencies (requirements.txt)"
              echo ""
              echo '```'
              cat requirements.txt
              echo '```'
              echo ""
            fi
          } > "$CONTEXT_FILE"

          echo "context_file=$CONTEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "Context file written ($(wc -c < "$CONTEXT_FILE") bytes)."

      - name: Build and create Copilot fix issue
        if: steps.context.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const prNumber   = process.env.PR_NUMBER;
            const headBranch = process.env.HEAD_BRANCH;

            // Read collected context files
            const scanReport = fs.readFileSync('/tmp/scan-report.md', 'utf8');
            const repoContext = fs.readFileSync('/tmp/repo-context.md', 'utf8');

            // Build the issue body — this is the prompt for the Copilot agent
            const issueBody = [
              `## Security Auto-Fix Request`,
              ``,
              `> Automatically generated by the **Copilot Security Auto-Fix** workflow.`,
              `> Source PR: #${prNumber} (branch: \`${headBranch}\`)`,
              ``,
              `---`,
              ``,
              `### Instructions`,
              ``,
              `The **PR Security Scan** workflow detected findings on PR #${prNumber}.`,
              `Please analyze the scan report and the repository context below, then create`,
              `a fix PR **against the \`${headBranch}\` branch** that resolves the security`,
              `findings. Follow the repository conventions described in the context section.`,
              ``,
              `**Important guidelines:**`,
              `- Fix only the findings reported in the scan — do not refactor unrelated code.`,
              `- For SCA (dependency) findings: update the vulnerable packages in \`requirements.txt\` to the recommended fix versions.`,
              `- For SAST findings: apply the minimal code change that resolves the issue while preserving existing behavior.`,
              `- For IaC findings: update the Terraform modules to comply with security best practices and the OPA Rego policies.`,
              `- Run \`python -m pytest tests/ -v\` to verify your changes do not break existing tests.`,
              `- Reference PR #${prNumber} in the fix PR description.`,
              ``,
              `---`,
              ``,
              `### Security Scan Report`,
              ``,
              scanReport,
              ``,
              `---`,
              ``,
              `### Repository Context`,
              ``,
              `<details>`,
              `<summary>Click to expand full repository context</summary>`,
              ``,
              repoContext,
              ``,
              `</details>`,
            ].join('\n');

            // Create the issue and assign it to Copilot
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🔒 Security Auto-Fix: Resolve scan findings from PR #${prNumber}`,
              body:  issueBody,
              labels: ['security', 'copilot-autofix'],
              assignees: ['copilot'],
            });

            core.info(`Created issue #${issue.number}: ${issue.html_url}`);

            // Post a notification comment on the original PR
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: parseInt(prNumber),
              body: [
                `## 🤖 Copilot Security Auto-Fix Triggered`,
                ``,
                `The security scan found actionable findings on this PR.`,
                `A Copilot auto-fix task has been created: #${issue.number}`,
                ``,
                `Copilot will open a fix PR against \`${headBranch}\` shortly.`,
              ].join('\n'),
            });
