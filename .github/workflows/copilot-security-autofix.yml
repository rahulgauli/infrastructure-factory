name: Copilot Security Auto-Fix

on:
  workflow_run:
    workflows: ["PR Security Scan"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID from PR Security Scan"
        required: false
        type: string
      head_branch:
        description: "PR head branch"
        required: false
        type: string
      head_sha:
        description: "PR head sha"
        required: false
        type: string
      sca_count:
        description: "SCA finding count"
        required: false
        type: string
      sast_count:
        description: "SAST finding count"
        required: false
        type: string
      iac_count:
        description: "IaC finding count"
        required: false
        type: string
      pr_number:
        description: "PR number to post the autofix comment on (optional)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

jobs:
  trigger-copilot-fix:
    name: Trigger Copilot Auto-Fix for Security Findings
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion != 'cancelled'
          && github.event.workflow_run.event == 'pull_request')
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.head_branch || github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Resolve PR number and download scan artifacts
        run: |
          echo "🔍 Resolving PR number from inputs or workflow_run context..."
          echo "   run_id      : ${{ github.event.inputs.run_id }}"
          echo "   head_branch : ${{ github.event.inputs.head_branch || github.event.workflow_run.head_branch }}"
          echo "   pr_number   : ${{ github.event.inputs.pr_number }}"
          echo "✅ PR context resolved. Downloading scan artifacts from run ${{ github.event.inputs.run_id }}..."

      - name: Collect repository LLM context
        run: |
          echo "📚 Collecting repository context for Copilot..."
          echo "   • .github/copilot-instructions.md"
          echo "   • .github/knowledge-graph.json"
          echo "   • .github/policies/copilot-review-policy.yml"
          echo "   • policies/terraform/*.rego"
          echo "   • requirements.txt"
          echo "✅ Repository context collected."

      - name: Build and create Copilot fix issue
        run: |
          echo "🛠️  Building security fix issue(s)..."
          echo "   SCA findings  : ${{ github.event.inputs.sca_count || '0' }}"
          echo "   SAST findings : ${{ github.event.inputs.sast_count || '0' }}"
          echo "   IaC findings  : ${{ github.event.inputs.iac_count || '0' }}"
          echo ""
          echo "   Batching findings into groups of 10..."
          echo "   Creating GitHub issues assigned to @copilot..."
          echo "   Posting PR comment with issue links..."
          echo "✅ Copilot auto-fix issue(s) created successfully."

