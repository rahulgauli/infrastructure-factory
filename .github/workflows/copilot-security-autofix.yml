name: Copilot Security Auto-Fix

on:
  workflow_run:
    workflows: ["PR Security Scan"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID from PR Security Scan"
        required: false
        type: string
      head_branch:
        description: "PR head branch"
        required: false
        type: string
      head_sha:
        description: "PR head sha"
        required: false
        type: string
      sca_count:
        description: "SCA finding count"
        required: false
        type: string
      sast_count:
        description: "SAST finding count"
        required: false
        type: string
      iac_count:
        description: "IaC finding count"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

jobs:
  trigger-copilot-fix:
    name: Trigger Copilot Auto-Fix for Security Findings
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion != 'cancelled'
          && github.event.workflow_run.event == 'pull_request')
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.head_branch || github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Resolve PR number and download scan artifacts
        id: context
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const path = require('path');
            const runId = context.payload.inputs?.run_id
              || context.payload.workflow_run?.id;
            const headBranch = context.payload.inputs?.head_branch
              || context.payload.workflow_run?.head_branch;
            const scaCount = parseInt(context.payload.inputs?.sca_count || '0', 10);
            const sastCount = parseInt(context.payload.inputs?.sast_count || '0', 10);
            const iacCount = parseInt(context.payload.inputs?.iac_count || '0', 10);

            // --- 1. Resolve the pull request number ---------------------------------
            const headRepo = context.payload.workflow_run?.head_repository
              || context.repo;

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              head:  `${headRepo.owner.login}:${headBranch}`,
            });

            if (!pulls.length) {
              core.setOutput('has_findings', 'false');
              core.info('No open PR found for this workflow run — skipping.');
              return;
            }
            const prNumber = pulls[0].number;
            core.setOutput('pr_number', String(prNumber));
            core.info(`Resolved PR #${prNumber}`);

            const totalFromCounts = scaCount + sastCount + iacCount;

            // --- 2. Download *-comment.md artifacts from the triggering run ---------
            // This is more reliable than parsing the PR comment body, which may not
            // yet be visible or may show "no findings" if the artifact download failed.
            if (totalFromCounts === 0 && !runId) {
              core.setOutput('has_findings', 'false');
              core.info('No workflow run ID provided and counts are zero — skipping.');
              return;
            }

            const artifactList = runId
              ? (await github.rest.actions.listWorkflowRunArtifacts({
                  owner:  context.repo.owner,
                  repo:   context.repo.repo,
                  run_id: runId,
                })).data
              : { artifacts: [] };

            const noFindingsPatterns = [
              '_No vulnerable dependencies found._',
              '_No SAST findings at the configured severity thresholds._',
              '_No IaC policy violations found._',
            ];

            const wantedArtifacts = ['sca-results', 'sast-results', 'iac-results'];
            const commentFiles    = {
              'sca-results':  'sca-comment.md',
              'sast-results': 'sast-comment.md',
              'iac-results':  'iac-comment.md',
            };

            fs.mkdirSync('/tmp/scan-artifacts', { recursive: true });

            let totalFindings = totalFromCounts;
            const sectionReports = {};

            for (const artifactName of wantedArtifacts) {
              const artifact = artifactList.artifacts.find(a => a.name === artifactName);
              if (!artifact) {
                core.warning(`Artifact '${artifactName}' not found in run ${runId}`);
                sectionReports[artifactName] = noFindingsPatterns[wantedArtifacts.indexOf(artifactName)];
                continue;
              }

              // Download the zip
              const { data: zipData } = await github.rest.actions.downloadArtifact({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });

              const zipPath = `/tmp/scan-artifacts/${artifactName}.zip`;
              fs.writeFileSync(zipPath, Buffer.from(zipData));

              // Unzip (use shell via exec)
              const { execSync } = require('child_process');
              const extractDir = `/tmp/scan-artifacts/${artifactName}`;
              fs.mkdirSync(extractDir, { recursive: true });
              execSync(`unzip -o ${zipPath} -d ${extractDir}`);

              // Read the comment markdown file
              const commentFile = path.join(extractDir, commentFiles[artifactName]);
              if (fs.existsSync(commentFile)) {
                const content = fs.readFileSync(commentFile, 'utf8').trim();
                sectionReports[artifactName] = content;
                // Any content that is NOT a "no findings" message means there are findings
                const isClean = noFindingsPatterns.some(p => content === p);
                if (!isClean && totalFromCounts === 0) totalFindings++;
                core.info(`${artifactName}: ${isClean ? 'clean' : 'HAS FINDINGS'}`);
              } else {
                core.warning(`Comment file not found in artifact: ${commentFile}`);
                sectionReports[artifactName] = noFindingsPatterns[wantedArtifacts.indexOf(artifactName)];
              }
            }

            if (totalFindings === 0) {
              core.setOutput('has_findings', 'false');
              core.info('All scans are clean — no auto-fix needed.');
              return;
            }

            core.setOutput('has_findings', 'true');

            // --- 3. Build the scan report from artifact content ---------------------
            const report = [
              '### 1️⃣ SCA – Dependency Vulnerability Scan (Trivy)',
              '',
              sectionReports['sca-results'],
              '',
              '### 2️⃣ SAST – Static Code Analysis (Bandit + Semgrep)',
              '',
              sectionReports['sast-results'],
              '',
              '### 3️⃣ IaC – Infrastructure as Code Scan (Checkov)',
              '',
              sectionReports['iac-results'],
            ].join('\n');

            fs.writeFileSync('/tmp/scan-report.md', report);
            core.info(`Scan report saved (${report.length} chars).`);

      - name: Collect repository LLM context
        if: steps.context.outputs.has_findings == 'true'
        id: llm_context
        run: |
          CONTEXT_FILE="/tmp/repo-context.md"
          {
            echo "# Repository Context for Copilot Auto-Fix"
            echo ""

            # Copilot instructions
            if [ -f .github/copilot-instructions.md ]; then
              echo "## Copilot Instructions"
              echo ""
              cat .github/copilot-instructions.md
              echo ""
            fi

            echo "---"
            echo ""

            # Knowledge graph (summarised)
            if [ -f .github/knowledge-graph.json ]; then
              echo "## Knowledge Graph"
              echo ""
              echo '```json'
              cat .github/knowledge-graph.json
              echo '```'
              echo ""
            fi

            echo "---"
            echo ""

            # Copilot review policy
            if [ -f .github/policies/copilot-review-policy.yml ]; then
              echo "## Copilot Review Policy"
              echo ""
              echo '```yaml'
              cat .github/policies/copilot-review-policy.yml
              echo '```'
              echo ""
            fi

            echo "---"
            echo ""

            # Rego policies
            echo "## OPA Rego Policies"
            echo ""
            for f in policies/terraform/*.rego; do
              if [ -f "$f" ]; then
                echo "### $(basename "$f")"
                echo ""
                echo '```rego'
                cat "$f"
                echo '```'
                echo ""
              fi
            done

            echo "---"
            echo ""

            # Requirements
            if [ -f requirements.txt ]; then
              echo "## Python Dependencies (requirements.txt)"
              echo ""
              echo '```'
              cat requirements.txt
              echo '```'
              echo ""
            fi
          } > "$CONTEXT_FILE"

          echo "context_file=$CONTEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "Context file written ($(wc -c < "$CONTEXT_FILE") bytes)."

      - name: Build and create Copilot fix issue
        if: steps.context.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_BRANCH: ${{ github.event.inputs.head_branch || github.event.workflow_run.head_branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const prNumber   = process.env.PR_NUMBER;
            const headBranch = process.env.HEAD_BRANCH;

            const MAX_SCAN_REPORT_CHARS = 8000;
            const MAX_CONTEXT_CHARS = 10000;
            const MAX_ISSUE_BODY_CHARS = 60000; // GitHub hard limit is 65536
            const BATCH_SIZE = 10;
            const truncate = (text, max) =>
              text.length > max
                ? `${text.slice(0, max)}\n\n... [truncated, ${text.length - max} chars omitted]`
                : text;

            const extractRows = (sectionText) => {
              const lines = sectionText.split('\n');
              return lines.filter(l => l.startsWith('|') && !l.startsWith('|---'));
            };

            const rebuildTable = (headerLines, rows) => {
              if (!rows.length || !headerLines.length) return null;
              return [...headerLines, ...rows].join('\n');
            };

            // Read collected context files
            const scanReport = truncate(fs.readFileSync('/tmp/scan-report.md', 'utf8'), MAX_SCAN_REPORT_CHARS);
            const repoContext = truncate(fs.readFileSync('/tmp/repo-context.md', 'utf8'), MAX_CONTEXT_CHARS);

            // Split report into sections
            const sections = {
              sca: scanReport.split('### 1️⃣ SCA – Dependency Vulnerability Scan (Trivy)')[1] || '',
              sast: scanReport.split('### 2️⃣ SAST – Static Code Analysis (Bandit + Semgrep)')[1] || '',
              iac: scanReport.split('### 3️⃣ IaC – Infrastructure as Code Scan (Checkov)')[1] || '',
            };

            const scaText = sections.sca.split('### 2️⃣')[0]?.trim() || '';
            const sastText = sections.sast.split('### 3️⃣')[0]?.trim() || '';
            const iacText = sections.iac.trim();

            const scaLines = scaText.split('\n');
            const sastLines = sastText.split('\n');
            const iacLines = iacText.split('\n');

            // Capture both the column-name row AND the |---| separator row so
            // rebuildTable emits a valid GitHub Markdown table.
            const captureHeader = (lines, keyword) => {
              const idx = lines.findIndex(l => l.startsWith('|') && l.includes(keyword));
              if (idx === -1) return [];
              // idx = column row; idx+1 = separator row (starts with |--)
              return lines.slice(idx, idx + 2).filter(l => l.startsWith('|'));
            };

            const scaHeader  = captureHeader(scaLines,  'Package');
            const sastHeader = captureHeader(sastLines, 'Tool');
            const iacHeader  = captureHeader(iacLines,  'Framework');

            // extractRows already excludes |--- lines; skip only the header row (index 0)
            const scaRows  = extractRows(scaText).slice(1);
            const sastRows = extractRows(sastText).slice(1);
            const iacRows  = extractRows(iacText).slice(1);

            const allFindings = [
              ...scaRows.map(r => ({ section: 'sca', row: r })),
              ...sastRows.map(r => ({ section: 'sast', row: r })),
              ...iacRows.map(r => ({ section: 'iac', row: r })),
            ];

            const totalBatches = Math.max(1, Math.ceil(allFindings.length / BATCH_SIZE));
            const batches = [];
            for (let i = 0; i < totalBatches; i++) {
              batches.push(allFindings.slice(i * BATCH_SIZE, (i + 1) * BATCH_SIZE));
            }

            const issues = [];
            for (let i = 0; i < batches.length; i++) {
              const batch = batches[i];
              const scaBatch = batch.filter(b => b.section === 'sca').map(b => b.row);
              const sastBatch = batch.filter(b => b.section === 'sast').map(b => b.row);
              const iacBatch = batch.filter(b => b.section === 'iac').map(b => b.row);

              const batchReport = [
                `### 1️⃣ SCA – Dependency Vulnerability Scan (Trivy)`,
                ``,
                rebuildTable(scaHeader, scaBatch) || '_No vulnerable dependencies found._',
                ``,
                `### 2️⃣ SAST – Static Code Analysis (Bandit + Semgrep)`,
                ``,
                rebuildTable(sastHeader, sastBatch) || '_No SAST findings at the configured severity thresholds._',
                ``,
                `### 3️⃣ IaC – Infrastructure as Code Scan (Checkov)`,
                ``,
                rebuildTable(iacHeader, iacBatch) || '_No IaC policy violations found._',
              ].join('\n');

              const issueBody = [
                `## Security Auto-Fix Request (Batch ${i + 1}/${batches.length})`,
                ``,
                `> Automatically generated by the **Copilot Security Auto-Fix** workflow.`,
                `> Source PR: #${prNumber} (branch: \`${headBranch}\`)`,
                ``,
                `---`,
                ``,
                `### Instructions`,
                ``,
                `The **PR Security Scan** workflow detected findings on PR #${prNumber}.`,
                `This batch contains up to ${BATCH_SIZE} findings. Create a fix PR **against the \`${headBranch}\` branch**`,
                `that resolves only the findings in this batch.`,
                ``,
                `**Important guidelines:**`,
                `- Fix only the findings reported in this batch — do not refactor unrelated code.`,
                `- For SCA (dependency) findings: update the vulnerable packages in \`requirements.txt\` to the recommended fix versions.`,
                `- For SAST findings: apply the minimal code change that resolves the issue while preserving existing behavior.`,
                `- For IaC findings: update the Terraform modules to comply with security best practices and the OPA Rego policies.`,
                `- Run \`python -m pytest tests/ -v\` to verify your changes do not break existing tests.`,
                `- Reference PR #${prNumber} in the fix PR description.`,
                ``,
                `---`,
                ``,
                `### Security Scan Report (Batch ${i + 1})`,
                ``,
                batchReport,
                ``,
                `---`,
                ``,
                `### Repository Context`,
                ``,
                `<details>`,
                `<summary>Click to expand repository context (trimmed)</summary>`,
                ``,
                repoContext,
                ``,
                `</details>`,
              ].join('\n');

              // Ensure labels exist (create them if missing — ignore errors if they already exist)
              for (const [name, color, description] of [
                ['security',        'e11d48', 'Security findings'],
                ['copilot-autofix', '6e40c9', 'Copilot auto-fix request'],
              ]) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name, color, description,
                  });
                } catch { /* label already exists — that's fine */ }
              }

              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: `🔒 Security Auto-Fix (Batch ${i + 1}/${batches.length}) for PR #${prNumber}`,
                body:  truncate(issueBody, MAX_ISSUE_BODY_CHARS),
                labels: ['security', 'copilot-autofix'],
                assignees: ['copilot'],
              });

              // Assigning 'copilot' requires "Copilot on Issues" to be enabled in repo
              // Settings → General → Copilot. If the assignment was silently dropped
              // (GitHub ignores unknown assignees rather than erroring), log a warning.
              if (!issue.assignees?.some(a => a.login === 'copilot')) {
                core.warning(`Issue #${issue.number}: 'copilot' was not assigned. Enable "Copilot on Issues" in repo Settings → General → Copilot.`);
              }

              issues.push(issue.number);
              core.info(`Created issue #${issue.number}: ${issue.html_url}`);
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: parseInt(prNumber),
              body: [
                `## 🤖 Copilot Security Auto-Fix Triggered`,
                ``,
                `The security scan findings were split into ${batches.length} batch(es) of up to ${BATCH_SIZE}.`,
                `Created issues: ${issues.map(n => `#${n}`).join(', ')}`,
                ``,
                `Copilot will open fix PRs against \`${headBranch}\` shortly.`,
              ].join('\n'),
            });
