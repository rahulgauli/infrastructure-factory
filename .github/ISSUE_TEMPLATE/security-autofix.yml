name: "🔒 Security Auto-Fix Request"
description: "Auto-generated by the PR Security Scan workflow. Assign to @copilot to trigger an automated fix PR."
title: "🔒 Security Auto-Fix (Batch __N__/__TOTAL__) for PR #__PR__"
labels:
  - security
  - copilot-autofix
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Automatically generated by the **Copilot Security Auto-Fix** workflow.
        > Fill in the PR number, batch info, and paste the relevant findings below.

  - type: input
    id: pr_ref
    attributes:
      label: Source Pull Request
      description: "PR number this fix targets"
      placeholder: "#5"
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Target Branch
      description: "Branch the fix PR should be opened against"
      placeholder: "feature/my-branch"
    validations:
      required: true

  - type: textarea
    id: findings
    attributes:
      label: Security Scan Findings (this batch)
      description: "Paste the Markdown table rows for this batch from the PR scan comment."
      placeholder: |
        | # | Framework | Check ID | Check Name | Resource | Location |
        |---|-----------|----------|------------|----------|----------|
        | 1 | terraform | `CKV_AWS_23` | Ensure every security group has a description | `aws_security_group.this` | `/terraform/modules/aws/ec2/main.tf: L36-59` |
    validations:
      required: true

  - type: textarea
    id: guidelines
    attributes:
      label: Fix Guidelines
      value: |
        - Fix **only** the findings listed above — do not refactor unrelated code.
        - **IaC findings**: update the Terraform module(s) to comply with the Checkov check and the OPA Rego policies in `policies/terraform/`.
        - **SCA findings**: update the vulnerable package(s) in `requirements.txt` to the recommended fix version.
        - **SAST findings**: apply the minimal code change that resolves the issue while preserving existing behavior.
        - Run `python -m pytest tests/ -v` to verify your changes do not break existing tests.
        - Open the fix PR against the **Target Branch** above and reference this issue in the description.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Definition of Done
      options:
        - label: All findings in this batch are resolved
        - label: No unrelated code was changed
        - label: `python -m pytest tests/ -v` passes
        - label: Fix PR references this issue
